<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Shard Replication Flow</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* ─── Tokens — strict black/white, mathematical ─────────────────────────── */
:root {
  --bg:       #ffffff;
  --fg:       #000000;
  --fg-mid:   #444444;
  --fg-dim:   #888888;
  --fg-faint: #bbbbbb;
  --rule:     #000000;
  --rule-lt:  #cccccc;
  --s0:       #000000;   /* shard 0 */
  --s1:       #555555;   /* shard 1 */
  --s2:       #aaaaaa;   /* shard 2 */
  --font-body: 'EB Garamond', Georgia, serif;
  --font-mono: 'JetBrains Mono', 'Courier New', monospace;
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.55;
  padding: 0 28px;
  padding-block: env(safe-area-inset-top, 0px) env(safe-area-inset-bottom, 32px);
  overflow-x: hidden;
}

/* ─── Header ─────────────────────────────────────────────────────────────── */
.header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
  padding: 8px 0 6px;
  border-bottom: 1px solid var(--rule);
  margin-bottom: 10px;
}

.header-left { display: flex; flex-direction: column; gap: 1px; }

.header h1 {
  font-family: var(--font-body);
  font-size: 17px;
  font-weight: 500;
  font-style: italic;
  color: var(--fg);
  letter-spacing: 0;
}

.header-sub {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--fg-dim);
  letter-spacing: 0.04em;
}

.controls {
  display: flex;
  align-items: baseline;
  gap: 14px;
  flex-wrap: wrap;
}

.btn {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 3px 10px;
  border: 1px solid var(--fg);
  background: var(--bg);
  color: var(--fg);
  cursor: pointer;
  border-radius: 0;
  transition: background 0.1s, color 0.1s;
}
.btn:hover  { background: var(--fg); color: var(--bg); }
.btn.active { background: var(--fg); color: var(--bg); }

.speed-control {
  display: flex;
  align-items: baseline;
  gap: 7px;
}
.speed-label {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--fg-dim);
  letter-spacing: 0.05em;
  text-transform: uppercase;
}
.speed-val {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--fg);
  min-width: 28px;
}

input[type=range] {
  -webkit-appearance: none;
  width: 72px;
  height: 2px;
  background: var(--fg-faint);
  border-radius: 0;
  cursor: pointer;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 10px;
  height: 10px;
  border-radius: 0;
  background: var(--fg);
  cursor: pointer;
}

/* ─── Pipeline ───────────────────────────────────────────────────────────── */
.pipeline {
  display: grid;
  grid-template-columns: 1fr 40px 1fr 40px 1fr;
  align-items: start;
  margin-bottom: 16px;
}

@media (max-width: 640px) {
  .pipeline { grid-template-columns: 1fr; }
  .connector { display: none; }
}

.panel-wrap { display: flex; flex-direction: column; }

.panel-label {
  font-family: var(--font-body);
  font-size: 11px;
  font-variant: small-caps;
  letter-spacing: 0.08em;
  color: var(--fg-mid);
  margin-bottom: 6px;
  padding: 0 1px;
}

.panel {
  border: 1px solid var(--rule);
  background: var(--bg);
}

/* ─── Source rows ─────────────────────────────────────────────────────────── */
.shard-row {
  display: grid;
  grid-template-columns: 22px 1fr;
  gap: 10px;
  padding: 7px 12px;
  border-bottom: 1px solid var(--rule-lt);
}
.shard-row:last-child { border-bottom: none; }

.shard-index {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;
  color: var(--fg-dim);
  padding-top: 1px;
}

.shard-info { display: flex; flex-direction: column; gap: 5px; min-width: 0; }

.shard-name-row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
}

.shard-name {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  color: var(--fg);
}

.rate-badge {
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.04em;
  color: var(--fg-dim);
  text-transform: uppercase;
}
.rate-badge.stalled { color: var(--fg);     font-weight: 700; }
.rate-badge.lagging { color: var(--fg-mid); font-weight: 500; }
.rate-badge.normal  { color: var(--fg-dim);                   }
.rate-badge.fast    { color: var(--fg-dim);                   }

.lsn-inline {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 400;
  color: var(--fg-dim);
  font-variant-numeric: tabular-nums;
  margin-left: 6px;
}
.lsn-val { color: var(--fg); font-weight: 500; }

.rate-block { display: flex; flex-direction: column; gap: 4px; }
.rate-block.hidden { display: none; }

.rate-toggle {
  font-family: var(--font-mono);
  font-size: 9px;
  color: var(--fg-faint);
  cursor: pointer;
  background: none;
  border: none;
  padding: 0;
  text-align: left;
  letter-spacing: 0.04em;
  margin-top: 3px;
}
.rate-toggle:hover { color: var(--fg-dim); }

.rate-slider-row {
  display: flex;
  align-items: center;
  gap: 7px;
}
.rate-slider-label {
  font-family: var(--font-mono);
  font-size: 9px;
  color: var(--fg-faint);
  white-space: nowrap;
  min-width: 58px;
}
input.rate-slider { flex: 1; width: auto; }
.rate-slider-val {
  font-family: var(--font-mono);
  font-size: 9px;
  color: var(--fg-mid);
  min-width: 24px;
  text-align: right;
  font-variant-numeric: tabular-nums;
}

/* ─── Connector ───────────────────────────────────────────────────────────── */
.connector {
  display: flex;
  align-items: center;
  justify-content: center;
  padding-top: 30px;
}

/* ─── Log Store ───────────────────────────────────────────────────────────── */
.log-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  padding: 7px 12px 6px;
  border-bottom: 1px solid var(--rule);
  background: var(--bg);
}
.log-title {
  font-family: var(--font-body);
  font-size: 11px;
  font-variant: small-caps;
  letter-spacing: 0.08em;
  color: var(--fg-mid);
}
.log-stat {
  font-family: var(--font-mono);
  font-size: 9px;
  color: var(--fg-dim);
  font-variant-numeric: tabular-nums;
}
.log-stat span { color: var(--fg); }

.log-lane {
  display: flex;
  align-items: stretch;
  border-bottom: 1px solid var(--rule-lt);
  min-height: 34px;
  overflow: hidden;
}
.log-lane:last-child { border-bottom: none; }

.log-lane-tag {
  flex-shrink: 0;
  width: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-right: 1px solid var(--rule-lt);
  font-family: var(--font-mono);
  font-size: 7px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  writing-mode: vertical-rl;
  text-orientation: mixed;
  transform: rotate(180deg);
  color: var(--fg-dim);
}

.log-lane-body {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 3px 8px 4px;
}

.log-lane-entries {
  display: flex;
  align-items: center;
  gap: 3px;
  overflow: hidden;
  margin-bottom: 5px;
  height: 20px;
  flex-shrink: 0;
}

.log-entry {
  flex-shrink: 0;
  height: 20px;
  min-width: 40px;
  padding: 0 6px;
  display: flex;
  align-items: center;
  font-family: var(--font-mono);
  font-size: 9px;
  font-variant-numeric: tabular-nums;
  border: 1px solid var(--rule-lt);
  color: var(--fg-mid);
  white-space: nowrap;
}
/* shard-specific tones for entries */
.log-entry.s0 { border-color: #000; color: #000; }
.log-entry.s1 { border-color: #666; color: #555; }
.log-entry.s2 { border-color: #aaa; color: #888; }

.log-entry.new {}


/* ─── Destination rows ────────────────────────────────────────────────────── */
.dest-shard-row {
  display: grid;
  grid-template-columns: 22px 1fr;
  align-items: start;
  gap: 10px;
  padding: 7px 12px;
  border-bottom: 1px solid var(--rule-lt);
}
.dest-shard-row:last-child { border-bottom: none; }

.dest-index {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;
  color: var(--fg-dim);
}

.dest-info { min-width: 0; display: flex; flex-direction: column; gap: 3px; }

.dest-name {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  color: var(--fg);
}


.lag-pill {
  font-family: var(--font-mono);
  font-size: 9px;
  padding: 2px 6px;
  border: 1px solid var(--fg-faint);
  color: var(--fg-dim);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  align-self: flex-start;
}
.lag-pill.zero   { border-color: var(--fg-faint); color: var(--fg-faint); }
.lag-pill.low    { border-color: var(--fg-dim);   color: var(--fg-dim);   }
.lag-pill.medium { border-color: var(--fg-mid);   color: var(--fg-mid);   }
.lag-pill.high   { border-color: var(--fg);       color: var(--fg);       font-weight: 700; }

/* ─── Log Store footer (LST marker) ─────────────────────────────────────── */
.log-footer {
  position: relative;
  height: 38px;
  border-top: 1px solid var(--rule);
  overflow: visible;
}
.lst-marker {
  position: absolute;
  top: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  transform: translateX(-50%);
  left: -999px;
}
.lst-marker-arrow {
  width: 0; height: 0;
  border-left: 3px solid transparent;
  border-right: 3px solid transparent;
  border-bottom: 5px solid #1a6b3c;
}
.lst-marker-tick {
  width: 1px;
  height: 6px;
  background: #1a6b3c;
}
.lst-marker-label {
  font-family: var(--font-mono);
  font-size: 8px;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: #1a6b3c;
  margin-top: 1px;
}
.lst-marker-val {
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  color: #1a6b3c;
}

/* ─── Log position timeline ──────────────────────────────────────────────── */
.timeline-section { margin-bottom: 12px; }

.tl-row {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 6px 12px;
  border-bottom: 1px solid var(--rule-lt);
}
.tl-row:last-child { border-bottom: none; }

.tl-name {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;
  color: var(--fg-dim);
  white-space: nowrap;
  padding-top: 4px;
  min-width: 68px;
}

.tl-body {
  display: flex;
  flex-direction: column;
  gap: 0;
}

.tl-chips {
  display: flex;
  gap: 3px;
}

/* fixed-width chips for the timeline so marker math works */
.tl-chips .log-entry {
  width: 44px;
  min-width: 44px;
  flex-shrink: 0;
  justify-content: center;
}

.tl-markers {
  position: relative;
  height: 52px;
  /* width set by JS to match chips row exactly */
}

.tl-mark {
  position: absolute;
  top: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  transform: translateX(-50%);
}
.tl-mark-tick {
  width: 1px;
  background: var(--fg-dim);
  height: 10px;
  flex-shrink: 0;
}
/* upward arrowhead at bottom of tick, pointing toward the chip */
.tl-mark-arrow {
  width: 0; height: 0;
  border-left: 3px solid transparent;
  border-right: 3px solid transparent;
  border-bottom: 5px solid var(--fg-dim);
  flex-shrink: 0;
}
.tl-mark-label {
  font-family: var(--font-mono);
  font-size: 8px;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  white-space: nowrap;
  color: var(--fg-dim);
  margin-top: 1px;
}
.tl-mark.tl-mark-log                  { top: 0; }
.tl-mark.tl-mark-log .tl-mark-tick    { height: 7px; background: #2255aa; }
.tl-mark.tl-mark-log .tl-mark-arrow   { border-bottom-color: #2255aa; }
.tl-mark.tl-mark-log .tl-mark-label   { color: #2255aa; }
.tl-mark.tl-mark-dst                  { top: 26px; }
.tl-mark.tl-mark-dst .tl-mark-tick    { height: 6px; background: #b03000; }
.tl-mark.tl-mark-dst .tl-mark-arrow   { border-bottom-color: #b03000; }
.tl-mark.tl-mark-dst .tl-mark-label   { color: #b03000; }

/* ─── Stats bar ───────────────────────────────────────────────────────────── */
.stats-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 28px;
  padding: 10px 0;
  border-top: 1px solid var(--rule);
}
.stat-item { display: flex; flex-direction: column; gap: 1px; }
.stat-key {
  font-family: var(--font-body);
  font-size: 11px;
  font-variant: small-caps;
  letter-spacing: 0.07em;
  color: var(--fg-dim);
}
.stat-val {
  font-family: var(--font-mono);
  font-size: 17px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  color: var(--fg);
}

/* ─── Particle canvas ─────────────────────────────────────────────────────── */
#particle-layer {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 0;
}
.pipeline, .header, .timeline-section, .stats-bar { position: relative; z-index: 1; }
</style>
</head>
<body>

<canvas id="particle-layer"></canvas>

<div class="header">
  <div class="header-left">
    <h1>Shard Replication Flow</h1>
    <div class="header-sub">source shards → log store → standby cluster</div>
  </div>
  <div class="controls">
    <div class="speed-control">
      <span class="speed-label">Speed</span>
      <input type="range" id="global-speed" min="0.1" max="2" step="0.05" value="0.4">
      <span class="speed-val" id="speed-disp">0.4×</span>
    </div>
    <button class="btn" id="play-btn">▶ Play</button>
    <button class="btn" id="back-btn">← Back</button>
    <button class="btn" id="step-btn">→ Step</button>
    <button class="btn" id="reset-btn">↺ Reset</button>
  </div>
</div>

<div class="pipeline" id="pipeline">

  <div class="panel-wrap">
    <div class="panel-label">Source Cluster</div>
    <div class="panel">
      <div id="source-shards"></div>
    </div>
  </div>

  <div class="connector">
    <svg width="40" height="200" viewBox="0 0 40 200" style="width:40px;overflow:visible">
      <defs>
        <marker id="ah1" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto">
          <path d="M0,0 L5,2.5 L0,5 Z" fill="#000"/>
        </marker>
      </defs>
      <line x1="20" y1="8" x2="20" y2="188" stroke="#000" stroke-width="1" marker-end="url(#ah1)"/>
    </svg>
  </div>

  <div class="panel-wrap">
    <div class="panel-label" style="color:#2255aa">Log Store</div>
    <div class="panel">
      <div class="log-header">
        <span class="log-title">Log Store</span>
        <span class="log-stat">n = <span id="total-entries">0</span></span>
      </div>
      <div id="log-lanes"></div>
      <div class="log-footer" id="log-footer">
        <div class="lst-marker" id="lst-marker">
          <div class="lst-marker-arrow"></div>
          <div class="lst-marker-tick"></div>
          <div class="lst-marker-label">LSTS</div>
          <div class="lst-marker-val" id="lst-footer">0</div>
        </div>
      </div>
    </div>
  </div>

  <div class="connector">
    <svg width="40" height="200" viewBox="0 0 40 200" style="width:40px;overflow:visible">
      <defs>
        <marker id="ah2" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto">
          <path d="M0,0 L5,2.5 L0,5 Z" fill="#000"/>
        </marker>
      </defs>
      <line x1="20" y1="8" x2="20" y2="188" stroke="#000" stroke-width="1" marker-end="url(#ah2)"/>
    </svg>
  </div>

  <div class="panel-wrap">
    <div class="panel-label" style="color:#b03000">Standby Cluster</div>
    <div class="panel">
      <div id="dest-shards"></div>
      <div class="log-footer" id="dest-footer">
        <div class="lst-marker" id="hst-marker">
          <div class="lst-marker-arrow"></div>
          <div class="lst-marker-tick"></div>
          <div class="lst-marker-label">HSTS / ESTS</div>
          <div class="lst-marker-val" id="hsts-footer">0</div>
        </div>
      </div>
    </div>
  </div>

</div>

<div class="timeline-section">
  <div class="panel-label">Log Position Overview</div>
  <div class="panel" id="timeline-panel"></div>
</div>

<div class="stats-bar">
  <div class="stat-item">
    <div class="stat-key">Log entries</div>
    <div class="stat-val" id="stat-total">0</div>
  </div>
  <div class="stat-item">
    <div class="stat-key">Shards caught up</div>
    <div class="stat-val" id="stat-caught">0 / 3</div>
  </div>
  <div class="stat-item">
    <div class="stat-key">Max lag</div>
    <div class="stat-val" id="stat-maxlag">0</div>
  </div>
  <div class="stat-item">
    <div class="stat-key">LSTS</div>
    <div class="stat-val" id="stat-lst" style="color:#1a6b3c">0</div>
  </div>
  <div class="stat-item">
    <div class="stat-key">HSTS / ESTS</div>
    <div class="stat-val" id="stat-hsts" style="color:#1a6b3c">0</div>
  </div>
  <div class="stat-item">
    <div class="stat-key">Sim time</div>
    <div class="stat-val" id="stat-time">0.0s</div>
  </div>
</div>

<script>
// ─── Config ───────────────────────────────────────────────────────────────
const NUM_SHARDS = 3;
const MAX_LOG_VISIBLE = 6;
const MAX_HISTORY = 80;

// Per-shard grayscale tones for particles
const SHARD_TONES = ['#000000', '#555555', '#aaaaaa'];
const SHARD_CLASSES = ['s0', 's1', 's2'];

// ─── State ────────────────────────────────────────────────────────────────
let running = false;
let globalSpeed = 0.4;
let simTime = 0;
let lastFrame = performance.now();
let totalEntries = 0;
let history = []; // stack of snapshots for reverse stepping

const DEFAULT_WRITE = [1.5, 1.0, 2.0];
const DEFAULT_LOG   = [2.5, 2.0, 3.5];
const DEFAULT_DEST  = [0.8, 1.5, 0.5];

const shards = Array.from({ length: NUM_SHARDS }, (_, i) => ({
  id: i,
  name: `shard-0${i}`,
  sourceLSN: 0, logLSN: 0, destLSN: 0,
  _srcAcc: 0, _logAcc: 0, _dstAcc: 0,
  writeRate: DEFAULT_WRITE[i],
  logRate:   DEFAULT_LOG[i],
  destRate:  DEFAULT_DEST[i],
  tone: SHARD_TONES[i],
  cls:  SHARD_CLASSES[i],
  srcEntries: [],
  logEntries: [],
  dstEntries: [],
  particles: [],
  _pAcc: { src: 0, dst: 0 },
}));

// ─── DOM refs ─────────────────────────────────────────────────────────────
const sourceCont   = document.getElementById('source-shards');
const logLanesEl   = document.getElementById('log-lanes');
const destCont     = document.getElementById('dest-shards');
const timelinePanel = document.getElementById('timeline-panel');
const canvas       = document.getElementById('particle-layer');
const ctx          = canvas.getContext('2d');

// ─── Build DOM ────────────────────────────────────────────────────────────
function classifyRate(r) {
  if (r < 0.6)  return 'stalled';
  if (r < 1.2)  return 'lagging';
  if (r < 2.5)  return 'normal';
  return 'fast';
}

shards.forEach(s => {
  // Source row
  const srcRow = document.createElement('div');
  srcRow.className = 'shard-row';
  srcRow.id = `src-row-${s.id}`;
  srcRow.innerHTML = `
    <div class="shard-index">${s.id}</div>
    <div class="shard-info">
      <div class="shard-name-row">
        <div class="shard-name">${s.name}<span class="lsn-inline">LSN: <span class="lsn-val" id="src-lsn-${s.id}">0</span></span></div>
        <div class="rate-badge normal" id="src-badge-${s.id}">normal</div>
      </div>
      <div class="log-lane-entries" id="src-entries-${s.id}" style="margin-bottom:4px"></div>
      <button class="rate-toggle" id="rate-toggle-${s.id}">rates ▸</button>
      <div class="rate-block hidden" id="rate-block-${s.id}" style="margin-top:4px">
        <div class="rate-slider-row">
          <span class="rate-slider-label">write rate</span>
          <input type="range" class="rate-slider" id="wr-slider-${s.id}" min="0" max="5" step="0.1" value="${s.writeRate}">
          <span class="rate-slider-val" id="wr-val-${s.id}">${s.writeRate.toFixed(1)}</span>
        </div>
        <div class="rate-slider-row">
          <span class="rate-slider-label">log ingest</span>
          <input type="range" class="rate-slider" id="lr-slider-${s.id}" min="0" max="6" step="0.1" value="${s.logRate}">
          <span class="rate-slider-val" id="lr-val-${s.id}">${s.logRate.toFixed(1)}</span>
        </div>
        <div class="rate-slider-row">
          <span class="rate-slider-label">dest apply</span>
          <input type="range" class="rate-slider" id="dr-slider-${s.id}" min="0" max="5" step="0.1" value="${s.destRate}">
          <span class="rate-slider-val" id="dr-val-${s.id}">${s.destRate.toFixed(1)}</span>
        </div>
      </div>
    </div>
  `;
  sourceCont.appendChild(srcRow);

  document.getElementById(`rate-toggle-${s.id}`).addEventListener('click', function() {
    const block = document.getElementById(`rate-block-${s.id}`);
    const open = block.classList.toggle('hidden');
    this.textContent = open ? 'rates ▸' : 'rates ▾';
  });

  document.getElementById(`wr-slider-${s.id}`).addEventListener('input', function() {
    s.writeRate = parseFloat(this.value);
    document.getElementById(`wr-val-${s.id}`).textContent = s.writeRate.toFixed(1);
  });
  document.getElementById(`lr-slider-${s.id}`).addEventListener('input', function() {
    s.logRate = parseFloat(this.value);
    document.getElementById(`lr-val-${s.id}`).textContent = s.logRate.toFixed(1);
  });
  document.getElementById(`dr-slider-${s.id}`).addEventListener('input', function() {
    s.destRate = parseFloat(this.value);
    document.getElementById(`dr-val-${s.id}`).textContent = s.destRate.toFixed(1);
  });

  // Log lane
  const lane = document.createElement('div');
  lane.className = 'log-lane';
  lane.id = `log-lane-${s.id}`;
  lane.innerHTML = `
    <div class="log-lane-tag">${s.name.slice(-3)}</div>
    <div class="log-lane-body">
      <div class="log-lane-entries" id="log-entries-${s.id}"></div>
    </div>
  `;
  logLanesEl.appendChild(lane);

  // Destination row
  const dstRow = document.createElement('div');
  dstRow.className = 'dest-shard-row';
  dstRow.id = `dst-row-${s.id}`;
  dstRow.innerHTML = `
    <div class="dest-index">${s.id}</div>
    <div class="dest-info">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
        <div class="dest-name">${s.name}<span class="lsn-inline">applied: <span class="lsn-val" id="dst-lsn-${s.id}">0</span></span></div>
        <div class="lag-pill zero" id="lag-pill-${s.id}">lag +0</div>
      </div>
      <div class="log-lane-entries" id="dst-entries-${s.id}" style="margin-bottom:4px"></div>
    </div>
  `;
  destCont.appendChild(dstRow);
});

// ─── Build timeline rows ──────────────────────────────────────────────────
const TL_WINDOW  = 12;   // number of source chips shown
const TL_CHIP_W  = 44;
const TL_CHIP_G  = 3;
const TL_STEP    = TL_CHIP_W + TL_CHIP_G;
const TL_TOTAL_W = TL_WINDOW * TL_CHIP_W + (TL_WINDOW - 1) * TL_CHIP_G; // 551px

shards.forEach(s => {
  const row = document.createElement('div');
  row.className = 'tl-row';
  row.innerHTML = `
    <div class="tl-name">${s.name}</div>
    <div class="tl-body">
      <div class="tl-chips" id="tl-chips-${s.id}"></div>
      <div class="tl-markers" id="tl-markers-${s.id}" style="width:${TL_TOTAL_W}px">
        <div class="tl-mark tl-mark-log" id="tl-mark-log-${s.id}" style="left:-999px">
          <div class="tl-mark-arrow"></div>
          <div class="tl-mark-tick"></div>
          <div class="tl-mark-label">LS</div>
        </div>
        <div class="tl-mark tl-mark-dst" id="tl-mark-dst-${s.id}" style="left:-999px">
          <div class="tl-mark-arrow"></div>
          <div class="tl-mark-tick"></div>
          <div class="tl-mark-label">dst</div>
        </div>
      </div>
    </div>
  `;
  timelinePanel.appendChild(row);
});

// Safe recovery window row at the bottom of the timeline
const recoveryRow = document.createElement('div');
recoveryRow.style.cssText = 'display:flex;align-items:center;gap:12px;padding:6px 12px 8px;border-top:1px solid var(--rule-lt)';
recoveryRow.innerHTML = `
  <div style="font-family:var(--font-mono);font-size:9px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;color:#1a6b3c;white-space:nowrap;min-width:68px">safe window</div>
  <div style="position:relative;width:${TL_TOTAL_W}px;height:30px">
    <div id="tl-recovery-span" style="position:absolute;top:2px;height:16px;display:none;background:rgba(26,107,60,0.13);border-left:2px solid #1a6b3c;border-right:2px solid #1a6b3c;box-sizing:border-box;overflow:visible">
      <span id="tl-ests-label" style="position:absolute;left:-1px;top:18px;transform:translateX(-50%);font-family:'JetBrains Mono',monospace;font-size:7px;font-weight:700;color:#1a6b3c;letter-spacing:0.04em;white-space:nowrap;line-height:1">ESTS</span>
      <span id="tl-lsts-label" style="position:absolute;right:-1px;top:18px;transform:translateX(50%);font-family:'JetBrains Mono',monospace;font-size:7px;font-weight:700;color:#1a6b3c;letter-spacing:0.04em;white-space:nowrap;line-height:1">LSTS</span>
    </div>
  </div>
`;
timelinePanel.appendChild(recoveryRow);

// ─── Snapshot helpers ─────────────────────────────────────────────────────
function takeSnapshot() {
  return {
    simTime,
    totalEntries,
    shards: shards.map(s => ({
      sourceLSN: s.sourceLSN, logLSN: s.logLSN, destLSN: s.destLSN,
      _srcAcc: s._srcAcc, _logAcc: s._logAcc, _dstAcc: s._dstAcc,
      _pAcc: { src: s._pAcc.src, dst: s._pAcc.dst },
      srcEntries: s.srcEntries.slice(),
      logEntries: s.logEntries.slice(),
      dstEntries: s.dstEntries.slice(),
    })),
  };
}

function restoreSnapshot(snap) {
  simTime = snap.simTime;
  totalEntries = snap.totalEntries;
  snap.shards.forEach((ss, i) => {
    const s = shards[i];
    s.sourceLSN = ss.sourceLSN; s.logLSN = ss.logLSN; s.destLSN = ss.destLSN;
    s._srcAcc = ss._srcAcc; s._logAcc = ss._logAcc; s._dstAcc = ss._dstAcc;
    s._pAcc = { src: ss._pAcc.src, dst: ss._pAcc.dst };
    s.srcEntries = ss.srcEntries.slice();
    s.logEntries = ss.logEntries.slice();
    s.dstEntries = ss.dstEntries.slice();
    s.particles = [];
    document.getElementById(`src-entries-${s.id}`).innerHTML = '';
    document.getElementById(`log-entries-${s.id}`).innerHTML = '';
    document.getElementById(`dst-entries-${s.id}`).innerHTML = '';
  });
}

function pauseForManualStep() {
  if (running) {
    running = false;
    document.getElementById('play-btn').textContent = '▶ Play';
    document.getElementById('play-btn').classList.remove('active');
  }
}

function stepForward() {
  pauseForManualStep();
  history.push(takeSnapshot());
  if (history.length > MAX_HISTORY) history.shift();
  fireOneEvent();
  updateDOM();
}

function stepBack() {
  pauseForManualStep();
  if (history.length === 0) return;
  restoreSnapshot(history.pop());
  updateDOM();
}

// ─── Controls ─────────────────────────────────────────────────────────────
document.getElementById('play-btn').addEventListener('click', function() {
  running = !running;
  this.textContent = running ? '⏸ Pause' : '▶ Play';
  this.classList.toggle('active', running);
  if (running) lastFrame = performance.now();
});

document.getElementById('back-btn').addEventListener('click', stepBack);
document.getElementById('step-btn').addEventListener('click', stepForward);

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return; // don't intercept slider focus
  if (e.key === 'ArrowRight') { e.preventDefault(); stepForward(); }
  if (e.key === 'ArrowLeft')  { e.preventDefault(); stepBack(); }
});

document.getElementById('reset-btn').addEventListener('click', () => {
  history = [];
  shards.forEach(s => {
    s.sourceLSN = s.logLSN = s.destLSN = 0;
    s._srcAcc = s._logAcc = s._dstAcc = 0;
    s.srcEntries = []; s.logEntries = []; s.dstEntries = []; s.particles = [];
    s._pAcc = { src: 0, dst: 0 };
    document.getElementById(`src-entries-${s.id}`).innerHTML = '';
    document.getElementById(`log-entries-${s.id}`).innerHTML = '';
    document.getElementById(`dst-entries-${s.id}`).innerHTML = '';
  });
  totalEntries = 0; simTime = 0;
});

const speedInput = document.getElementById('global-speed');
const speedDisp  = document.getElementById('speed-disp');
speedInput.addEventListener('input', function() {
  globalSpeed = parseFloat(this.value);
  speedDisp.textContent = globalSpeed.toFixed(2).replace(/0+$/, '').replace(/\.$/, '') + '×';
});

// ─── Canvas ───────────────────────────────────────────────────────────────
function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// ─── Particles ────────────────────────────────────────────────────────────
function getCenter(el) {
  if (!el) return { x: 0, y: 0 };
  const r = el.getBoundingClientRect();
  return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
}

function spawnParticle(shard, phase) {
  const srcEl = document.getElementById(`src-row-${shard.id}`);
  const logEl = document.getElementById(`log-lane-${shard.id}`);
  const dstEl = document.getElementById(`dst-row-${shard.id}`);
  if (!srcEl || !logEl || !dstEl) return;
  const start = phase === 'src-to-log' ? getCenter(srcEl) : getCenter(logEl);
  const end   = phase === 'src-to-log' ? getCenter(logEl) : getCenter(dstEl);
  const cx = (start.x + end.x) / 2 + (Math.random() - 0.5) * 16;
  const cy = (start.y + end.y) / 2 - 12;
  shard.particles.push({
    t: 0, dur: 0.65 + Math.random() * 0.35,
    sx: start.x, sy: start.y, cx, cy, ex: end.x, ey: end.y,
    tone: shard.tone, r: 2.5,
  });
}

function drawParticles(dt) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  shards.forEach(s => {
    s.particles = s.particles.filter(p => {
      p.t += dt / p.dur;
      if (p.t >= 1) return false;
      const t = p.t;
      const x = (1-t)*(1-t)*p.sx + 2*(1-t)*t*p.cx + t*t*p.ex;
      const y = (1-t)*(1-t)*p.sy + 2*(1-t)*t*p.cy + t*t*p.ey;
      const fade = t < 0.75 ? 1 : (1 - t) / 0.25;
      const alpha = Math.round(fade * 180).toString(16).padStart(2,'0');
      ctx.beginPath(); ctx.arc(x, y, p.r, 0, Math.PI*2);
      ctx.fillStyle = p.tone + alpha;
      ctx.fill();
      return true;
    });
  });
}

// ─── Simulation ───────────────────────────────────────────────────────────
const PARTICLE_EVERY = 3;

// Advance time to the next single event and fire exactly that one.
// Math guarantees no non-winner accumulator can cross 1 in minDt,
// so at most one entry is created anywhere per call.
function fireOneEvent() {
  let minDt = Infinity;
  let winShard = null, winStage = null;

  shards.forEach(s => {
    let dt;
    if (s.writeRate > 0) {
      dt = (1 - s._srcAcc) / s.writeRate;
      if (dt < minDt) { minDt = dt; winShard = s; winStage = 'src'; }
    }
    if (s.logRate > 0 && s.sourceLSN > s.logLSN) {
      dt = (1 - s._logAcc) / s.logRate;
      if (dt < minDt) { minDt = dt; winShard = s; winStage = 'log'; }
    }
    if (s.destRate > 0 && s.logLSN > s.destLSN) {
      dt = (1 - s._dstAcc) / s.destRate;
      if (dt < minDt) { minDt = dt; winShard = s; winStage = 'dst'; }
    }
  });

  if (!winShard) { simTime += 0.1; return; }

  // Advance all accumulators — guaranteed no non-winner crosses 1
  shards.forEach(s => {
    s._srcAcc += s.writeRate * minDt;
    if (s.sourceLSN > s.logLSN) s._logAcc += s.logRate * minDt;
    if (s.logLSN   > s.destLSN) s._dstAcc += s.destRate * minDt;
  });
  simTime += minDt;

  // Fire exactly the winning event
  const w = winShard;
  if (winStage === 'src') {
    w._srcAcc -= 1;
    w.srcEntries.push({ lsn: w.sourceLSN + 1 });
    if (w.srcEntries.length > 150) w.srcEntries = w.srcEntries.slice(-150);
    w.sourceLSN++;
    w._pAcc.src++;
  } else if (winStage === 'log') {
    w._logAcc -= 1;
    w.logEntries.push({ lsn: w.logLSN + 1 });
    if (w.logEntries.length > 150) w.logEntries = w.logEntries.slice(-150);
    w.logLSN++;
    totalEntries++;
  } else {
    w._dstAcc -= 1;
    w.dstEntries.push({ lsn: w.destLSN + 1 });
    if (w.dstEntries.length > 150) w.dstEntries = w.dstEntries.slice(-150);
    w.destLSN++;
    w._pAcc.dst++;
  }

  shards.forEach(s => {
    if (s._pAcc.src >= PARTICLE_EVERY) {
      s._pAcc.src -= PARTICLE_EVERY;
      if (Math.random() < 0.7) spawnParticle(s, 'src-to-log');
    }
    if (s._pAcc.dst >= PARTICLE_EVERY) {
      s._pAcc.dst -= PARTICLE_EVERY;
      if (Math.random() < 0.6) spawnParticle(s, 'log-to-dst');
    }
  });
}

// ─── DOM update ───────────────────────────────────────────────────────────
function updateDOM() {
  let caughtUp = 0, maxLag = 0;
  shards.forEach(s => {
    const lag = s.sourceLSN - s.destLSN;
    if (lag === 0) caughtUp++;
    if (lag > maxLag) maxLag = lag;

    document.getElementById(`src-lsn-${s.id}`).textContent = s.sourceLSN.toLocaleString();

    // Source entry strip
    const srcLaneEl = document.getElementById(`src-entries-${s.id}`);
    const srcVisible = s.srcEntries.slice(-MAX_LOG_VISIBLE);
    const srcExisting = new Set([...srcLaneEl.querySelectorAll('.log-entry')].map(e => e.dataset.lsn));
    srcVisible.forEach(entry => {
      if (!srcExisting.has(String(entry.lsn))) {
        const el = document.createElement('div');
        el.className = `log-entry ${s.cls} new`;
        el.dataset.lsn = entry.lsn;
        el.textContent = entry.lsn.toLocaleString();
        srcLaneEl.appendChild(el);
        setTimeout(() => el.classList.remove('new'), 200);
      }
    });
    while (srcLaneEl.children.length > MAX_LOG_VISIBLE) srcLaneEl.removeChild(srcLaneEl.firstChild);

    const cls = classifyRate(s.writeRate);
    const badge = document.getElementById(`src-badge-${s.id}`);
    badge.textContent = cls;
    badge.className = `rate-badge ${cls}`;

    const laneEl = document.getElementById(`log-entries-${s.id}`);
    const visible = s.logEntries.slice(-MAX_LOG_VISIBLE);
    const existing = new Set([...laneEl.querySelectorAll('.log-entry')].map(e => e.dataset.lsn));
    visible.forEach(entry => {
      if (!existing.has(String(entry.lsn))) {
        const el = document.createElement('div');
        el.className = `log-entry ${s.cls} new`;
        el.dataset.lsn = entry.lsn;
        el.textContent = entry.lsn.toLocaleString();
        laneEl.appendChild(el);
        setTimeout(() => el.classList.remove('new'), 200);
      }
    });
    while (laneEl.children.length > MAX_LOG_VISIBLE) laneEl.removeChild(laneEl.firstChild);

    document.getElementById(`dst-lsn-${s.id}`).textContent = s.destLSN.toLocaleString();

    // Dest entry strip
    const dstLaneEl = document.getElementById(`dst-entries-${s.id}`);
    const dstVisible = s.dstEntries.slice(-MAX_LOG_VISIBLE);
    const dstExisting = new Set([...dstLaneEl.querySelectorAll('.log-entry')].map(e => e.dataset.lsn));
    dstVisible.forEach(entry => {
      if (!dstExisting.has(String(entry.lsn))) {
        const el = document.createElement('div');
        el.className = `log-entry ${s.cls} new`;
        el.dataset.lsn = entry.lsn;
        el.textContent = entry.lsn.toLocaleString();
        dstLaneEl.appendChild(el);
        setTimeout(() => el.classList.remove('new'), 200);
      }
    });
    while (dstLaneEl.children.length > MAX_LOG_VISIBLE) dstLaneEl.removeChild(dstLaneEl.firstChild);

    const lagPill = document.getElementById(`lag-pill-${s.id}`);
    lagPill.textContent = 'lag +' + lag.toLocaleString();
    lagPill.className = 'lag-pill ' + (lag === 0 ? 'zero' : lag < 10 ? 'low' : lag < 30 ? 'medium' : 'high');
  });

  // ── Timeline update
  const lst          = Math.min(...shards.map(s => s.logLSN));
  const hstCandidate = Math.max(...shards.map(s => s.destLSN));
  const hst          = (hstCandidate > 0 && hstCandidate <= lst) ? hstCandidate : null;
  shards.forEach(s => {
    const windowStart = Math.max(1, s.sourceLSN - TL_WINDOW + 1);
    const windowEnd   = s.sourceLSN;

    // Rebuild chip row only when needed
    const chipsEl = document.getElementById(`tl-chips-${s.id}`);
    const existing = chipsEl.children.length;
    const needed   = Math.max(0, windowEnd - windowStart + 1);
    // Re-render if window shifted or count changed
    const firstShown = parseInt(chipsEl.firstElementChild?.dataset.lsn ?? 0);
    if (firstShown !== windowStart || existing !== needed) {
      chipsEl.innerHTML = '';
      for (let lsn = windowStart; lsn <= windowEnd; lsn++) {
        const chip = document.createElement('div');
        chip.className = `log-entry ${s.cls}`;
        chip.dataset.lsn = lsn;
        chip.textContent = lsn;
        chipsEl.appendChild(chip);
      }
    }

    // Position a marker: center of the chip for `lsn` within the window
    function markerLeft(lsn) {
      if (lsn < windowStart) return 0; // clamp to leftmost chip
      if (lsn > windowEnd)   return (windowEnd - windowStart) * TL_STEP + TL_CHIP_W / 2;
      return (lsn - windowStart) * TL_STEP + TL_CHIP_W / 2;
    }

    const logMark = document.getElementById(`tl-mark-log-${s.id}`);
    const dstMark = document.getElementById(`tl-mark-dst-${s.id}`);

    if (s.sourceLSN === 0) {
      logMark.style.left = '-999px';
      dstMark.style.left = '-999px';
    } else {
      logMark.style.left = markerLeft(s.logLSN) + 'px';
      dstMark.style.left = markerLeft(s.destLSN) + 'px';
    }
  });

  // Recovery window span — x-axis from the slowest log-store shard's chip window
  const refShard    = shards.find(s => s.logLSN === lst) || shards[0];
  const refWinStart = Math.max(1, refShard.sourceLSN - TL_WINDOW + 1);
  const refWinEnd   = refShard.sourceLSN;
  function refLeft(lsn) {
    if (lsn < refWinStart) return 0;
    if (lsn > refWinEnd)   return (refWinEnd - refWinStart) * TL_STEP + TL_CHIP_W / 2;
    return (lsn - refWinStart) * TL_STEP + TL_CHIP_W / 2;
  }
  const recoverySpan = document.getElementById('tl-recovery-span');
  if (hst !== null && lst > 0 && refShard.sourceLSN > 0) {
    const x1 = refLeft(hst);
    const x2 = refLeft(lst);
    recoverySpan.style.left    = x1 + 'px';
    recoverySpan.style.width   = Math.max(2, x2 - x1) + 'px';
    recoverySpan.style.display = '';
  } else {
    recoverySpan.style.display = 'none';
  }

  document.getElementById('total-entries').textContent = totalEntries.toLocaleString();
  document.getElementById('stat-total').textContent    = totalEntries.toLocaleString();
  document.getElementById('stat-caught').textContent   = `${caughtUp} / ${NUM_SHARDS}`;
  document.getElementById('stat-maxlag').textContent   = maxLag.toLocaleString();
  document.getElementById('stat-lst').textContent      = lst.toLocaleString();
  document.getElementById('lst-footer').textContent    = lst.toLocaleString();
  document.getElementById('stat-time').textContent     = simTime.toFixed(1) + 's';

  // Position LSTS marker under the chip for lst in the slowest log-store shard's lane
  const lstMarkerEl = document.getElementById('lst-marker');
  const footerEl    = document.getElementById('log-footer');
  const slowShard   = shards.find(s => s.logLSN === lst);
  if (slowShard && lst > 0) {
    const chip = document.querySelector(`#log-entries-${slowShard.id} [data-lsn="${lst}"]`);
    if (chip && footerEl) {
      const chipRect   = chip.getBoundingClientRect();
      const footerRect = footerEl.getBoundingClientRect();
      lstMarkerEl.style.left = (chipRect.left + chipRect.width / 2 - footerRect.left) + 'px';
    }
  } else {
    lstMarkerEl.style.left = '-999px';
  }

  // HSTS = max(destLSN), but only valid when ≤ LSTS; else recovery is impossible
  const hstMarkerEl  = document.getElementById('hst-marker');
  const destFooterEl = document.getElementById('dest-footer');
  const hstStatEl    = document.getElementById('stat-hsts');
  const hstFooterEl  = document.getElementById('hsts-footer');
  if (hst !== null) {
    hstStatEl.textContent   = hst.toLocaleString();
    hstFooterEl.textContent = hst.toLocaleString();
    hstStatEl.style.color   = '#1a6b3c';
    const fastDestShard = shards.find(s => s.destLSN === hstCandidate);
    const chip = document.querySelector(`#dst-entries-${fastDestShard.id} [data-lsn="${hst}"]`);
    if (chip && destFooterEl) {
      const chipRect   = chip.getBoundingClientRect();
      const footerRect = destFooterEl.getBoundingClientRect();
      hstMarkerEl.style.left = (chipRect.left + chipRect.width / 2 - footerRect.left) + 'px';
    }
  } else {
    hstStatEl.textContent   = hstCandidate > 0 ? '—' : '0';
    hstFooterEl.textContent = hstCandidate > 0 ? '—' : '0';
    hstStatEl.style.color   = hstCandidate > 0 ? '#b03000' : '#1a6b3c';
    hstMarkerEl.style.left  = '-999px';
  }
}

// ─── Loop ─────────────────────────────────────────────────────────────────
let playAcc = 0;

function frame(now) {
  const dtReal = Math.min((now - lastFrame) / 1000, 0.1);
  lastFrame = now;

  if (running) {
    playAcc += dtReal;
    // step interval: at speed 1x → ~8 events/sec; speed scales linearly
    const interval = 1 / (8 * globalSpeed);
    if (playAcc >= interval) {
      playAcc -= interval;
      fireOneEvent();
      updateDOM();
    }
  }

  drawParticles(dtReal);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
